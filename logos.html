<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de logotipos — Polux</title>
<style>
:root{
  --fondo:#0A0A0C; --fondo2:#101016; --tarjeta:#15151d; --borde:#262633;
  --acento:#A855F7; --texto:#f4f2fa; --muted:#a7a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{padding:46px 0 10px;text-align:center}
.kicker{display:inline-block;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--acento);
  border:1px solid rgba(168,85,247,.5);border-radius:999px;padding:7px 18px;margin-bottom:18px;background:rgba(168,85,247,.08)}
header.top h1{font-size:clamp(1.8rem,4.6vw,2.9rem);font-weight:800;margin-bottom:12px}
header.top h1 em{font-style:normal;color:var(--acento)}
.precio{max-width:720px;margin:0 auto 8px;color:var(--muted);font-size:.98rem}
.precio b{color:var(--texto)}
.back{display:inline-block;margin:18px 0 4px;color:var(--acento);text-decoration:none;font-weight:700;font-size:.92rem}
.back:hover{text-decoration:underline}
/* filtros */
.filtros{position:sticky;top:0;z-index:40;background:rgba(10,10,12,.92);backdrop-filter:blur(10px);
  padding:14px 0;border-bottom:1px solid var(--borde)}
.f-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.busca{flex:1;min-width:180px;background:#0d0d13;border:1px solid var(--borde);border-radius:999px;color:#fff;
  padding:11px 18px;font-size:.92rem;outline:none;font-family:inherit}
.busca:focus{border-color:var(--acento)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fchip{border:1px solid var(--borde);background:#101016;color:var(--muted);border-radius:999px;
  padding:8px 15px;font-size:.8rem;cursor:pointer;font-family:inherit;transition:all .15s}
.fchip.on{border-color:var(--acento);background:rgba(168,85,247,.16);color:#fff;font-weight:700}
.count{color:var(--muted);font-size:.82rem;margin:18px 0 6px}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px;padding:6px 0 120px}
.lg-tile{position:relative;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;
  padding:0;cursor:pointer;color:inherit;font-family:inherit;text-align:center;overflow:hidden;
  transition:transform .18s,border-color .18s,box-shadow .18s}
.lg-tile:hover{transform:translateY(-4px);border-color:var(--acento)}
.lg-tile.sel{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento),0 10px 30px rgba(168,85,247,.25)}
.lg-art{display:block;aspect-ratio:1/1;width:100%}
.lg-art svg{width:100%;height:100%;display:block}
.lg-name{display:block;font-weight:800;font-size:.92rem;padding:10px 8px 0}
.lg-sub{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;padding:2px 8px 12px;text-transform:uppercase}
.lg-pick{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;
  background:rgba(8,8,12,.6);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:all .15s}
.lg-tile.sel .lg-pick{background:var(--acento);border-color:var(--acento);color:#0A0A0C;font-weight:800}
.vacio{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px}
/* bandeja */
.tray{position:fixed;left:50%;transform:translate(-50%,140px);bottom:18px;z-index:50;display:flex;align-items:center;gap:12px;
  background:rgba(16,16,24,.94);border:1px solid var(--acento);border-radius:999px;padding:10px 10px 10px 20px;
  backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(168,85,247,.35);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.2);font-size:.92rem;max-width:calc(100vw - 32px)}
.tray.show{transform:translate(-50%,0)}
.tray .n{font-weight:800;color:var(--acento)}
.tray a{background:var(--acento);color:#0A0A0C;border-radius:999px;font-weight:800;padding:11px 22px;text-decoration:none;font-size:.92rem;white-space:nowrap}
footer{border-top:1px solid var(--borde);padding:26px 0;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html">← Volver al portafolio</a><br>
    <span class="kicker">Catálogo · Polux</span>
    <h1>100 logotipos <em>únicos</em></h1>
    <p class="precio">Marca con <b>✦</b> los que te gusten. Cuando armes tu paquete, el chatbot te da tu precio y tu promoción.</p>
  </header>
</div>
<div class="filtros">
  <div class="wrap">
    <div class="f-row">
      <input class="busca" id="busca" type="search" placeholder="Buscar por negocio o nicho… (ej. spa, café, taller)" aria-label="Buscar logotipos">
    </div>
    <div class="chips" id="fchips"></div>
  </div>
</div>
<div class="wrap">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div>
<div class="tray" id="tray" role="status" aria-live="polite">
  <span>✦ <span class="n" id="trayN">0</span> en tu lista</span>
  <a href="index.html?pedido=1">Revisar →</a>
</div>
<footer>© 2026 Polux · Cada logo se adapta a tu nombre, tus colores y tu negocio.</footer>
<script src="logos-motor.js"></script>
<script>

const KEY='poluxLogos';
const grid=document.getElementById('grid'),fchips=document.getElementById('fchips'),
      busca=document.getElementById('busca'),count=document.getElementById('count'),
      tray=document.getElementById('tray'),trayN=document.getElementById('trayN');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
let sel=new Set(load().map(l=>l.id));
let famF='todos',q='';
fchips.innerHTML=`<button class="fchip on" data-f="todos">Todos · 100</button>`+
 LOGO_FAMS.map(f=>`<button class="fchip" data-f="${f.id}">${f.label}</button>`).join('');
fchips.addEventListener('click',e=>{const b=e.target.closest('.fchip');if(!b)return;
 famF=b.dataset.f;fchips.querySelectorAll('.fchip').forEach(c=>c.classList.toggle('on',c===b));render()});
busca.addEventListener('input',()=>{q=busca.value.trim().toLowerCase();render()});
function match(l){
 if(famF!=='todos'&&l.fam!==famF)return false;
 if(q&&!(l.nombre+' '+l.nicho+' '+l.famLabel).toLowerCase().includes(q))return false;
 return true;
}
function render(){
 const list=LOGOS.filter(match);
 count.textContent=list.length===100?'Mostrando los 100 logotipos':`Mostrando ${list.length} de 100`;
 grid.innerHTML=list.length?list.map(l=>`
  <button type="button" class="lg-tile${sel.has(l.id)?' sel':''}" data-logo="${l.id}" data-familia="${l.fam}" data-nicho="${l.nicho}" aria-pressed="${sel.has(l.id)}" aria-label="Elegir logo ${l.nombre}">
   <span class="lg-art">${l.svg}</span>
   <span class="lg-name">${l.nombre}</span>
   <span class="lg-sub">${l.famLabel} · ${l.nicho}</span>
   <span class="lg-pick">${sel.has(l.id)?'✓':'✦'}</span>
  </button>`).join('')
  :'<p class="vacio">Nada coincide con esa búsqueda. Prueba con otro nicho: spa, café, taller, gym…</p>';
}
function paintTray(){trayN.textContent=sel.size;tray.classList.toggle('show',sel.size>0)}
grid.addEventListener('click',e=>{
 const t=e.target.closest('.lg-tile');if(!t)return;
 const id=t.dataset.logo;
 const l=LOGOS.find(x=>x.id===id);
 if(sel.has(id))sel.delete(id);else sel.add(id);
 save([...sel].map(sid=>{const x=LOGOS.find(y=>y.id===sid);return{id:x.id,nombre:x.nombre,fam:x.famLabel,nicho:x.nicho}}));
 const on=sel.has(id);
 t.classList.toggle('sel',on);t.setAttribute('aria-pressed',String(on));
 t.querySelector('.lg-pick').textContent=on?'✓':'✦';
 paintTray();
});
render();paintTray();
</script>
</body>
</html>
</script>
</body>
</html>
